<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <title>Діаграми та графіки на аналітичній панелі</title>
  <rect width="400" height="300" fill="#eef5fa"/>

  <!-- картка зі стовпчиковою діаграмою -->
  <rect x="16" y="16" width="232" height="170" rx="8" fill="#ffffff" stroke="#c8d3dd"/>
  <rect x="30" y="28" width="90" height="8" rx="4" fill="#9fb3c6"/>
  <line x1="36" y1="170" x2="234" y2="170" stroke="#9fb3c6" stroke-width="2"/>
  <line x1="36" y1="50" x2="36" y2="170" stroke="#9fb3c6" stroke-width="2"/>
  <g fill="#3b82c4">
    <rect x="50" y="120" width="22" height="50"/>
    <rect x="86" y="98" width="22" height="72"/>
    <rect x="122" y="108" width="22" height="62"/>
    <rect x="158" y="78" width="22" height="92"/>
  </g>
  <rect x="194" y="60" width="22" height="110" fill="#800020"/>
  <polyline points="61,112 97,90 133,100 169,70 205,52" fill="none" stroke="#f0a202" stroke-width="3"/>
  <g fill="#f0a202">
    <circle cx="61" cy="112" r="4"/>
    <circle cx="97" cy="90" r="4"/>
    <circle cx="133" cy="100" r="4"/>
    <circle cx="169" cy="70" r="4"/>
    <circle cx="205" cy="52" r="4"/>
  </g>

  <!-- картка з круговою діаграмою -->
  <rect x="262" y="16" width="122" height="170" rx="8" fill="#ffffff" stroke="#c8d3dd"/>
  <rect x="276" y="28" width="60" height="8" rx="4" fill="#9fb3c6"/>
  <circle cx="323" cy="100" r="42" fill="#3b82c4"/>
  <path d="M323,100 L323,58 A42,42 0 0,1 363,113 Z" fill="#800020"/>
  <path d="M323,100 L363,113 A42,42 0 0,1 302,136 Z" fill="#f0a202"/>
  <circle cx="323" cy="100" r="18" fill="#ffffff"/>
  <g fill="#9fb3c6">
    <rect x="280" y="156" width="40" height="6" rx="3"/>
    <rect x="280" y="168" width="60" height="6" rx="3"/>
  </g>

  <!-- картка з лінійним графіком -->
  <rect x="16" y="200" width="368" height="84" rx="8" fill="#ffffff" stroke="#c8d3dd"/>
  <path d="M30,262 C70,250 90,226 130,236 S200,264 240,240 S320,214 370,222 L370,272 L30,272 Z"
        fill="#cfe4f5"/>
  <path d="M30,262 C70,250 90,226 130,236 S200,264 240,240 S320,214 370,222"
        fill="none" stroke="#3b82c4" stroke-width="3"/>
  <rect x="30" y="210" width="70" height="7" rx="3" fill="#9fb3c6"/>
</svg>
