<!-- BEGIN TASK -->
<section class="card">
    <h2>Одновимірний масив (варіант 24)</h2>
    <p>
        Знайти суму всіх елементів масиву дійсних чисел, більших за дане
        число. Розмірність масиву - 20. Заповнення масиву здійснити
        випадковими числами від 50 до 100.
    </p>
</section>
<!-- END TASK -->

<!-- BEGIN FORM -->
<section class="card">
    <h2>Вхідні дані</h2>
    <div class="forma">
        <label for="chyslo">Дане число</label>
        <input type="number" id="chyslo" value="75" step="0.01" #c
               (input)="perevirka(c.value)">
        <button class="btn" type="button" [disabled]="pomylka != ''"
                (click)="rozrahunok(c.value)">Обчислити</button>
        <button class="btn btn-grey" type="button"
                (click)="novyj_masyv()">Новий масив</button>
    </div>
    <p class="error">{{ pomylka }}</p>
</section>
<!-- END FORM -->

<!-- BEGIN RESULT -->
<section class="card">
    <h2>Масив з {{ masyv.a.length }} елементів</h2>
    <div class="elements">
        <span class="element" *ngFor="let x of masyv.a"
              [class.bilshyj]="x > porig">{{ x }}</span>
    </div>
    <h2>Результат</h2>
    <p class="result">{{ rezultat }}</p>
</section>
<!-- END RESULT -->
